name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to S3
        # TODO 2 (AWS): Doc access key tu secret STORAGE_CREDENTIALS (JSON) va set
        #               cac bien moi truong de boto3/DVC tu xac thuc voi S3.
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          echo "AWS_ACCESS_KEY_ID=$(python -c 'import os,json;print(json.loads(os.environ["STORAGE_CREDENTIALS"])["aws_access_key_id"])')" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(python -c 'import os,json;print(json.loads(os.environ["STORAGE_CREDENTIALS"])["aws_secret_access_key"])')" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV

      - name: Pull data with DVC
        # TODO 3: Pull train_batch1.csv va holdout.csv tu S3 (khong can train_batch2.csv).
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        # TODO 4: Doc gia tri "f1_score" tu outputs/report.json bang Python inline.
        #         Set ket qua thanh output "f1" de job quality-gate co the doc.
        #
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to S3
        # TODO 5 (AWS): Upload models/model.joblib len
        #               s3://<bucket>/artifacts/current/model.joblib bang boto3.
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import boto3, os
          bucket = os.environ["ARTIFACT_BUCKET"]
          boto3.client("s3").upload_file(
              "models/model.joblib", bucket, "artifacts/current/model.joblib"
          )
          print("Model uploaded to S3.")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        # TODO 6: Doc f1 tu output cua job train.
        #         Neu f1 < 0.65, ket thuc voi loi ro rang.
        #         Neu dat nguong, in thong bao va tiep tuc.
        #
        # Goi y:
        #   f1 = float("${{ needs.train.outputs.f1 }}")
        #   if f1 < 0.65:
        #       raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
        #   print("PASSED: dang trien khai model.")
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os
          f1 = float(os.environ["F1"])
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # TODO 7: Restart service income-api tren VM.
            sudo systemctl restart income-api

            # TODO 8: Cho server san sang roi curl /healthz de xac nhan (thu lai nhieu lan).
            for i in 1 2 3 4 5 6; do
              sleep 5
              if curl -sf http://localhost:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              echo "Health check chua san sang, thu lai ($i)..."
            done
            echo "Health check that bai sau nhieu lan thu."
            exit 1
